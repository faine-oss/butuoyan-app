<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46d8" />
    <title>不拖延 Android 下载</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #1f2340; background: radial-gradient(circle at 10% 8%, #fff2bd 0 12%, transparent 34%), radial-gradient(circle at 92% 92%, #dfe8ff 0 12%, transparent 36%), #f7f8fc; }
      main { width: min(100%, 540px); border: 1px solid rgba(79, 70, 216, .14); border-radius: 28px; padding: clamp(24px, 6vw, 40px); background: rgba(255, 255, 255, .92); box-shadow: 0 24px 70px rgba(38, 43, 95, .14); }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 20px; color: white; background: linear-gradient(145deg, #635bdf, #4338ca); box-shadow: 0 12px 30px rgba(79, 70, 216, .28); font-size: 30px; }
      h1 { margin: 20px 0 8px; font-size: clamp(28px, 8vw, 40px); letter-spacing: -.05em; }
      .lead { margin: 0; color: #68708a; line-height: 1.7; }
      .version { margin: 24px 0 14px; border-radius: 16px; padding: 14px 16px; color: #4f46d8; background: #f0efff; font-weight: 800; }
      ul { margin: 0 0 24px; padding-left: 20px; color: #4f566f; line-height: 1.7; }
      .actions { display: grid; gap: 10px; }
      a { min-height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid #d9dce8; border-radius: 14px; color: #4f46d8; text-decoration: none; font-weight: 800; }
      a.primary { border-color: #4f46d8; color: white; background: #4f46d8; box-shadow: 0 10px 24px rgba(79, 70, 216, .22); }
      .hint { margin: 16px 0 0; color: #7d8498; font-size: 13px; line-height: 1.6; }
      .checksum { overflow-wrap: anywhere; margin-top: 20px; border-top: 1px solid #eceef5; padding-top: 16px; color: #858ba0; font: 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1>不拖延</h1>
      <p class="lead">安卓正式版下载站。主线路由 GitHub Pages 直接提供 APK，手机不需要打开 GitHub Release 网页。</p>
      <div class="version" id="version">正在读取最新版本…</div>
      <ul id="notes"></ul>
      <div class="actions">
        <a class="primary" download id="primary" href="./update.json">直接下载 APK</a>
        <a hidden id="backup" rel="noopener noreferrer" target="_blank">备用下载</a>
        <a hidden id="release" rel="noopener noreferrer" target="_blank">查看发布说明</a>
      </div>
      <p class="hint">下载后由 Android 系统确认安装。V0.3 以后正式版可覆盖更新并保留本地数据。</p>
      <div class="checksum" id="checksum"></div>
    </main>
    <script>
      fetch("./update.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("manifest unavailable");
          return response.json();
        })
        .then((manifest) => {
          document.querySelector("#version").textContent = `V${manifest.versionName} · ${manifest.title}`;
          document.querySelector("#notes").replaceChildren(
            ...manifest.notes.map((note) => {
              const item = document.createElement("li");
              item.textContent = note;
              return item;
            })
          );
          const primary = document.querySelector("#primary");
          primary.href = manifest.downloadUrl;
          const backup = manifest.downloadMirrors?.[0];
          if (backup) {
            const backupLink = document.querySelector("#backup");
            backupLink.href = backup.url;
            backupLink.textContent = backup.label;
            backupLink.hidden = false;
          }
          if (manifest.releasePageUrl) {
            const releaseLink = document.querySelector("#release");
            releaseLink.href = manifest.releasePageUrl;
            releaseLink.hidden = false;
          }
          document.querySelector("#checksum").textContent = `APK SHA-256：${manifest.sha256}`;
        })
        .catch(() => {
          document.querySelector("#version").textContent = "版本信息暂时不可用，请稍后刷新";
        });
    </script>
  </body>
</html>
